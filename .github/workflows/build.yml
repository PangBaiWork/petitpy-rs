# Build petitpy-rs for Linux, macOS, Windows and Android on every push,
# and run its generic test suite on every platform.
#
# Each job builds the three binaries (`petitpy-rs`, `petitpy-vm`,
# `zigpy-compile`) plus the shared library, and uploads them as an
# artifact named `petitpy-rs-<platform>`. Each job then runs the
# generic tests — `cargo test --release --lib` plus
# `cargo test --release --tests` — on the default build, and again
# with `--features unsafe-ffi` where the feature applies. Tests run
# in release mode: the debug lib suite has 10 known debug-assert
# failures, while the release suite is green. Lib and integration
# suites run as separate `cargo test` invocations: a combined
# `cargo test --lib --tests` hits an intermittent panic-strategy
# race (cargo, `abort` vs `unwind`).
#
# How each platform runs the tests (`matrix.test_mode`):
# - `run`: the test binaries execute natively. linux-aarch64
#   runs on GitHub's native arm64 runner (`ubuntu-24.04-arm`,
#   available for private repos since Jan 2026) — no qemu, no
#   cross-linker: the job overrides the repo's Zig aarch64
#   linker with the system `cc`.
# - `norun`: Android cannot execute test binaries on the
#   runner (they need a device/emulator), so the Android rows
#   compile the tests without running them (`--no-run`).
#   That proves the suite builds for Android; execution there
#   needs an emulator step, not added here.
#
# The `unsafe-ffi` feature runs on Linux, macOS and
# Windows: `errno()` is portable (Linux
# `__errno_location`, macOS `__error`, Windows
# `WSAGetLastError`), the socket wrappers have
# per-platform arms, and the os wrappers (`umask` /
# `close` / `fsync` / `lseek`) use the Unix syscalls on
# Unix and the MSVC CRT (`_umask` / `_close` / `_commit` /
# `_lseeki64`, CRT errno via `_get_errno`) on Windows —
# the RustPython `crt_fd` pattern. Android stays out: its
# rows only compile the tests (`--no-run`, no device to
# execute them on), so the feature is not exercised
# there. Rows with `ffi: true` build a second,
# `petitpy-rs-<platform>-unsafe-ffi` artifact; the other
# platforms ship the default (pure-std) build only.
#
# Windows is the MSVC target (`x86_64-pc-windows-msvc`) on
# `windows-latest`. The `x86_64-pc-windows-gnu` target exists
# only as a local cross-check (`scripts/zig-cc-windows.sh` +
# `.cargo/config.toml`) — the gnu build is a compile proxy,
# not a shipped artifact.

name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            exe: ""
            ffi: true
            test_mode: run
            no_run: ""
            zig: false
            android: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            exe: ""
            ffi: true
            test_mode: run
            no_run: ""
            zig: false
            android: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            exe: ".exe"
            ffi: true
            test_mode: run
            no_run: ""
            zig: false
            android: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            exe: ""
            ffi: true
            test_mode: run
            no_run: ""
            zig: false
            android: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            exe: ""
            ffi: true
            test_mode: run
            no_run: ""
            zig: false
            android: false
          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact: android-aarch64
            exe: ""
            ffi: false
            test_mode: norun
            no_run: "--no-run"
            zig: false
            android: true
            android_linker: aarch64-linux-android33-clang
            target_env: AARCH64_LINUX_ANDROID
          - os: ubuntu-latest
            target: x86_64-linux-android
            artifact: android-x86_64
            exe: ""
            ffi: false
            test_mode: norun
            no_run: "--no-run"
            zig: false
            android: true
            android_linker: x86_64-linux-android33-clang
            target_env: X86_64_LINUX_ANDROID
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The linux-aarch64 link uses the repo's Zig wrapper
      # (`.cargo/config.toml` → `scripts/zig-cc-aarch64.sh`),
      # so Zig 0.16.0 must be on PATH.
      - name: Install Zig 0.16.0
        if: matrix.zig
        shell: bash
        run: |
          curl -L -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      # Android has no system linker for the target: use the
      # NDK's clang (preinstalled on ubuntu-latest).
      - name: Set Android NDK linker
        if: matrix.android
        shell: bash
        run: |
          echo "CARGO_TARGET_${{ matrix.target_env }}_LINKER=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.android_linker }}" >> "$GITHUB_ENV"

      # The repo's .cargo/config.toml points the aarch64 target
      # at the Zig cross-linker wrapper (needed when building
      # aarch64 on an x86_64 host). On the native arm64 runner
      # the system linker is the right one; the env var
      # overrides the config file.
      - name: Use system linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"

      - name: Build (default)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test lib (default)
        run: cargo test --release --lib --target ${{ matrix.target }} ${{ matrix.no_run }}

      - name: Test integration (default)
        run: cargo test --release --tests --target ${{ matrix.target }} ${{ matrix.no_run }}

      - name: Collect (default)
        shell: bash
        run: |
          mkdir -p dist
          BIN_DIR="target/${{ matrix.target }}/release"
          cp "$BIN_DIR/petitpy-rs${{ matrix.exe }}" dist/
          cp "$BIN_DIR/petitpy-vm${{ matrix.exe }}" dist/
          cp "$BIN_DIR/zigpy-compile${{ matrix.exe }}" dist/
          # The shared library is `libpetitpy_rs.{so,dylib}` on
          # Unix (lib prefix) and `petitpy_rs.dll` on Windows. A
          # missing candidate must not fail the step: under `set -e`
          # a `for` loop exits with its last test's status, and on
          # Linux/macOS every name test fails, which was killing
          # this step with exit code 1 after the exes were copied.
          for ext in so dylib dll; do
            for cand in "$BIN_DIR/petitpy_rs.$ext" "$BIN_DIR/libpetitpy_rs.$ext"; do
              [ -f "$cand" ] && cp "$cand" dist/
            done
          done || true

      - name: Build (unsafe-ffi)
        if: matrix.ffi
        run: cargo build --release --target ${{ matrix.target }} --features unsafe-ffi

      # Feature tests run the same generic suites against the
      # feature build (this also exercises tests/g6a_os.rs,
      # which is feature-gated and otherwise never compiles).
      - name: Test lib (unsafe-ffi)
        if: matrix.ffi
        run: cargo test --release --lib --target ${{ matrix.target }} --features unsafe-ffi ${{ matrix.no_run }}

      - name: Test integration (unsafe-ffi)
        if: matrix.ffi
        run: cargo test --release --tests --target ${{ matrix.target }} --features unsafe-ffi ${{ matrix.no_run }}

      - name: Collect (unsafe-ffi)
        if: matrix.ffi
        shell: bash
        run: |
          mkdir -p dist-ffi
          BIN_DIR="target/${{ matrix.target }}/release"
          cp "$BIN_DIR/petitpy-rs${{ matrix.exe }}" dist-ffi/
          cp "$BIN_DIR/petitpy-vm${{ matrix.exe }}" dist-ffi/
          cp "$BIN_DIR/zigpy-compile${{ matrix.exe }}" dist-ffi/
          # See Collect (default): `lib` prefix on Unix, and the
          # loop must not fail the step when a name is absent.
          for ext in so dylib dll; do
            for cand in "$BIN_DIR/petitpy_rs.$ext" "$BIN_DIR/libpetitpy_rs.$ext"; do
              [ -f "$cand" ] && cp "$cand" dist-ffi/
            done
          done || true

      - name: Upload artifact (default)
        uses: actions/upload-artifact@v4
        with:
          name: petitpy-rs-${{ matrix.artifact }}
          path: dist/

      - name: Upload artifact (unsafe-ffi)
        if: matrix.ffi
        uses: actions/upload-artifact@v4
        with:
          name: petitpy-rs-${{ matrix.artifact }}-unsafe-ffi
          path: dist-ffi/
