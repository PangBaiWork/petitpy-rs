[package]
name = "petitpy-rs"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of petitpy (Abilian, Zig + MicroPython 0.9.0) — native make build (full config), checked line-by-line against the original"

# F1 (embedding API, ADR 022): the library is also the
# `ppy_*` C API from `include/petitpy.h` — a `cdylib` +
# `staticlib` (linkable from C) alongside the usual `rlib`
# the binaries use.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# G0: opt-in unsafe FFI. Default OFF — the default build stays pure
# std with zero unsafe in the VM core. With `unsafe-ffi` enabled,
# `select` uses the real POSIX select(2) via extern "C" (no libc
# crate, zero new dependencies) and the crate builds for
# aarch64-unknown-linux-gnu as well as x86_64-unknown-linux-gnu.
[features]
unsafe-ffi = []

[dependencies]
